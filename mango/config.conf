# More option see https://github.com/DreamMaoMao/mango/wiki/

source=~/.config/mango/looks.conf
source=~/.config/mango/layout.conf
source=~/.config//mango/devices.conf
source=~/.config/mango/binds.conf

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:tile
tag_rule=id:4,layout_name:tile
tag_rule=id:5,layout_name:tile
tag_rule=id:6,layout_name:tile
tag_rule=id:7,layout_name:tile
tag_rule=id:8,layout_name:tile
tag_rule=id:9,layout_name:tile

exec_once=swaync
exec_once=wl-paste --watch cliphist store
exec_once=waybar
exec_once=swayidle -w timeout 600 'wlr-dpms off' resume 'wlr-dpms on' timeout 900 'systemctl sleep' before-sleep 'swaylock -f -c 201B14'
exec_once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 &
exec_once=openrgb -p main
