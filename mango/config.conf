# More option see https://github.com/DreamMaoMao/mango/wiki/

source=~/.config/mango/looks.conf
source=~/.config/mango/layout.conf
source=~/.config//mango/devices.conf
source=~/.config/mango/binds.conf

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:dwindle
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

exec-once=swaync
exec-once=wl-paste --watch cliphist store
exec-once=waybar
exec-once=swayidle -w timeout 404040 'wlr-dpms off' resume 'wlr-dpms on' timeout 900 'swaylock -f -c 201B14' before-sleep 'swaylock -f -c 201B14'
exec-once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 &
