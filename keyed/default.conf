# Swedish Colemak-DH (ISO) for keyd, as a toggleable layer.
# Keep your system keyboard layout set to Swedish (se).
#
# Hold Ctrl+Alt and tap K to toggle Colemak-DH on/off.
# Works regardless of whether you press Ctrl or Alt first.
# Starts in normal QWERTY (Swedish) on boot.
#
# Layout when active:
#   q  w  f  p  b    j  l  u  y  ö  å
#   a  r  s  t  g    m  n  e  i  o  ä
# z  x  c  d  v  <   k  h  ,  .  -

[ids]
*

[main]
leftcontrol = layer(control)
leftalt = layer(alt)

# Whichever modifier is pressed second switches into a combined
# "ctrlalt" layer instead of its normal layer, so k only fires
# the toggle when BOTH are actually held.
[control]
leftalt = layer(ctrlalt)

[alt]
leftcontrol = layer(ctrlalt)

[ctrlalt]
k = toggle(colemak)

[colemak]
# Top row
e = f
r = p
t = b
y = j
u = l
i = u
o = y
p = semicolon

# Home row
s = r
d = s
f = t
h = m
j = n
k = e
l = i
semicolon = o

# Bottom row (ISO angle mod: <> key becomes z, B becomes <>)
v = d
b = v
n = k
m = h
